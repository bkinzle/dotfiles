[tools]
java = "openjdk-21"
maven = "3"
python = "3.15"
terraform = "1"
terragrunt = "latest"
devspace = "latest"
jq = "latest"
yq = "latest"
node = "latest"
fzf = "latest"
go = "latest"
bun = "latest"
lazygit = "latest"
yazi = "latest"
fd = "latest"
ripgrep = "latest"
zoxide = "latest"
argocd = "latest"
k6 = "latest"
"npm:@mixedbread/mgrep" = "latest"
"github:ahmetb/kubectl-tree" = "latest"
"github:tohjustin/kube-lineage" = "latest"

[tools.uv]
version = "latest"
minimum_release_age = "0s"

[tools.claude]
version = "latest"
minimum_release_age = "0s"

[tools."npm:@openai/codex"]
version = "latest"
minimum_release_age = "0s"

[tools.copilot]
version = "latest"
minimum_release_age = "0s"

[tools."github:colbymchenry/codegraph"]
version = "latest"
minimum_release_age = "0s"

# helm-unittest is a Helm plugin (not in mise's registry); install it via a
# helm-scoped postinstall hook. Idempotent; Helm 4 needs --verify=false.
[tools.helm]
version = "latest"
postinstall = "helm plugin list | grep -q unittest || helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false"

[settings]
idiomatic_version_file_enable_tools = []
experimental = true

[settings.python]
uv_venv_auto = true

# gh keeps its token in the macOS keyring, which mise can't read (it only reads
# gh's hosts.yml), so ask gh for it. Avoids the 60/hr unauthenticated limit.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
